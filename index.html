<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جِدّاو | JEDDAW — جدة تبدأ من هنا</title>
    <meta name="description" content="جِدّاو يرتّب لك طلعة كاملة في جدة حسب وقتك وميزانيتك ومودك. اختر موقعك ووقتك، ونرتّب لك الخطة كاملة في أقل من دقيقة." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("jeddaw_theme") || localStorage.getItem("wesh_theme");
          var isDark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF6F0] dark:bg-[#121817] text-[#252A28] dark:text-[#F5F1E8]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #051413; color: #FAF6F0; font-family: system-ui, -apple-system, sans-serif; direction: rtl; text-align: center; padding: 20px; box-sizing: border-box;">
        <div style="width: 72px; height: 72px; border-radius: 24px; background-color: #091C1A; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); margin-bottom: 16px;">
          <span style="font-size: 32px; font-weight: 900; color: #C96745;">جـ</span>
        </div>
        <h1 style="font-size: 22px; font-weight: 900; margin: 0 0 4px 0; color: #FAF6F0; letter-spacing: -0.5px;">جِدّاو | JEDDAW</h1>
        <p style="font-size: 12px; font-weight: 700; color: rgba(250, 246, 240, 0.7); margin: 0 0 24px 0;">جدة تبدأ من هنا ✨</p>
        <div style="width: 140px; height: 3px; background: linear-gradient(90deg, #C96745, #E4A23B, #397C78); border-radius: 99px; animation: pulseGlow 1.5s ease-in-out infinite;"></div>
        <style>@keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }</style>
      </div>
    </div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
