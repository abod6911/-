<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>مربع الكتابة المخصص للجوال</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #FAF6F0;
      color: #252A28;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
      direction: rtl;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-box {
      width: 100%; max-width: 400px;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 20px;
      border: 3px solid #C96745;
      box-shadow: 0 12px 30px rgba(201, 103, 69, 0.15);
      display: flex; flex-direction: column; gap: 16px;
    }
    .box-title {
      font-size: 18px; font-weight: 900; color: #252A28; text-align: center;
    }
    .mobile-input {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid #C96745;
      background: #FAF6F0;
      font-size: 16px !important; /* Prevents iOS auto-zoom lock */
      font-weight: 700;
      color: #252A28;
      outline: none;
      touch-action: manipulation;
    }
    .result-display {
      min-height: 50px;
      padding: 14px;
      border-radius: 14px;
      background: #E6F0EF;
      border: 1px solid rgba(57, 124, 120, 0.3);
      color: #295652;
      font-weight: 800;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="mobile-box">
    <div class="box-title">📝 مربع الكتابة المخصص للجوال</div>
    
    <input
      id="customMobileInput"
      type="text"
      inputmode="text"
      autocomplete="one-time-code"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="اكتب هنا بالجوال..."
      class="mobile-input"
      oninput="document.getElementById('liveText').innerText = this.value || 'لم يتم كتابة شيء بعد...'"
    />

    <div style="font-size: 12px; font-weight: 800; color: #6E716C;">النص الظاهر مباشر:</div>
    <div id="liveText" class="result-display">لم يتم كتابة شيء بعد...</div>
  </div>

</body>
</html>
