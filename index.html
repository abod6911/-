<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>مربع كتابة مخصص للجوال</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px;
      direction: rtl;
      -webkit-tap-highlight-color: transparent;
    }
    .single-card {
      width: 100%; max-width: 400px;
      background: #1E293B;
      border-radius: 20px;
      padding: 24px 16px;
      border: 2px solid #38BDF8;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; gap: 16px;
    }
    .custom-input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 2px solid #38BDF8;
      background: #0F172A;
      font-size: 16px !important; /* ⚠️ 16px Prevents iOS Auto-Zoom */
      font-weight: 700;
      color: #FFFFFF;
      outline: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .text-display {
      min-height: 50px;
      padding: 14px;
      border-radius: 12px;
      background: #334155;
      color: #38BDF8;
      font-weight: 800;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="single-card">
    <div style="font-size: 16px; font-weight: 900; text-align: center; color: #38BDF8;">
      📝 مربع كتابة مخصص للجوال
    </div>

    <input
      id="pureInput"
      type="text"
      inputmode="text"
      autocomplete="one-time-code"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="اكتب هنا مباشرة..."
      class="custom-input"
    />

    <div style="font-size: 11px; font-weight: 700; color: #94A3B8;">النص المكتوب:</div>
    <div id="outputDisplay" class="text-display">لم يتم كتابة شيء بعد...</div>
  </div>

  <script>
    // Debounce 300ms
    function debounce(func, delay = 300) {
      let timer;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => func.apply(this, args), delay);
      };
    }

    const handleInput = debounce((e) => {
      document.getElementById('outputDisplay').innerText = e.target.value || 'لم يتم كتابة شيء بعد...';
    }, 300);

    document.getElementById('pureInput').addEventListener('input', handleInput);
  </script>
</body>
</html>
