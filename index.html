<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>موقع الكتابة المخصص للجوال</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #121817;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
      direction: rtl;
      -webkit-tap-highlight-color: transparent;
    }
    .box-card {
      width: 100%; max-width: 420px;
      background: #1C2422;
      border-radius: 24px;
      padding: 28px 20px;
      border: 3px solid #C96745;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; gap: 18px;
    }
    .title {
      font-size: 18px; font-weight: 900; color: #E4A23B; text-align: center;
    }
    .input-field {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid #C96745;
      background: #0D1211;
      font-size: 16px !important;
      font-weight: 700;
      color: #ffffff;
      outline: none;
      touch-action: manipulation;
    }
    .display-area {
      min-height: 60px;
      padding: 16px;
      border-radius: 16px;
      background: #25302D;
      border: 1px solid rgba(201, 103, 69, 0.3);
      color: #9EE0D0;
      font-weight: 800;
      font-size: 15px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="box-card">
    <div class="title">📱 موقع الكتابة الجديد المخصص للجوال</div>
    
    <input
      id="mainBox"
      type="text"
      inputmode="text"
      autocomplete="one-time-code"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="اكتب هنا مباشرة..."
      class="input-field"
      oninput="document.getElementById('textMirror').innerText = this.value || 'اكتب وسوف يظهر النص هنا فوراً...'"
    />

    <div style="font-size: 12px; font-weight: 800; color: #8A9B97;">النص المكتوب:</div>
    <div id="textMirror" class="display-area">اكتب وسوف يظهر النص هنا فوراً...</div>
  </div>

</body>
</html>
