<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>صفحة اختبار حقل الكتابة المستقلة | iPhone Input Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF6F0;
      color: #252A28;
      padding: 24px 16px;
      direction: rtl;
    }
    .test-card {
      max-width: 440px;
      margin: 0 auto;
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      border: 2px solid #C96745;
      box-shadow: 0 10px 25px rgba(201, 103, 69, 0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .test-title {
      font-size: 16px;
      font-weight: 900;
      color: #252A28;
      border-bottom: 1px solid #E2D3BE;
      padding-bottom: 10px;
    }
    .input-label {
      font-size: 12px;
      font-weight: 800;
      color: #397C78;
      margin-bottom: 6px;
      display: block;
    }
    .test-input {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 2px solid #C96745;
      background: #fff;
      font-size: 16px !important; /* CRITICAL FOR IOS SAFARI */
      font-weight: 700;
      color: #252A28;
      outline: none;
      touch-action: manipulation;
    }
    .output-box {
      font-size: 13px;
      font-weight: 800;
      color: #C96745;
      background: #FAF6F0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #E2D3BE;
      min-height: 44px;
    }
  </style>
</head>
<body>

  <div class="test-card">
    <div class="test-title">🧪 تجربة الكتابة المستقلة على جوالك الآيفون</div>
    <p style="font-size: 12px; color: #6E716C; font-weight: 600;">يرجى تجربة الكتابة في هذا الحقل المستقل بالكيبورد العربية للآيفون:</p>

    <!-- Standalone Input Field for iOS Testing -->
    <div>
      <label class="input-label">مربع الكتابة (المحمي من تعليق قاموس الآيفون):</label>
      <input
        id="standaloneInput"
        type="text"
        inputmode="text"
        autocomplete="one-time-code"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="اكتب أي حرف هنا بالكيبورد العربية وشوف..."
        class="test-input"
        oninput="document.getElementById('liveResult').innerText = this.value"
      />
    </div>

    <div>
      <span style="font-size: 11px; font-weight: 800; color: #6E716C;">النص المكتوب حالياً:</span>
      <div id="liveResult" class="output-box">لم يتم كتابة شيء بعد...</div>
    </div>
  </div>

</body>
</html>
