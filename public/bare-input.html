<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bare Mobile Input Test</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var k of keys) { caches.delete(k); }
      });
    }
  </script>
</head>
<body style="font-family: sans-serif; padding: 30px; background: #fff;">
  <h2>اختبار أولي خام جداً بدون أي جافاسكريبت أو تنسيقات</h2>
  <p>يرجى تجربة الكتابة في هذا الحقل البسيط جداً:</p>

  <div style="margin-top: 20px;">
    <input type="text" placeholder="اكتب هنا وشوف..." style="width: 100%; padding: 15px; font-size: 18px; box-sizing: border-box;">
  </div>
</body>
</html>
