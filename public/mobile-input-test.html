<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var k of keys) { caches.delete(k); }
      });
    }
  </script>
  <title>Mobile Input Test (Pure Static HTML)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
      background: #faf6f0;
      color: #252a28;
    }
    h2 { color: #c96745; margin-bottom: 8px; font-size: 18px; }
    p { font-size: 13px; color: #6e716c; margin-bottom: 16px; line-height: 1.5; }
    .input-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
      font-size: 13px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      font-size: 16px !important;
      border: 1px solid #e2d3be;
      border-radius: 12px;
      box-sizing: border-box;
      background: #ffffff;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div style="background: #c96745; color: #fff; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; margin-bottom: 12px; text-align: center;">
    🔥 النسخة الحية المحدثة الآن: 23:25 | كود التحديث: #999
  </div>
  <h2>🧪 Mobile Keyboard Diagnostic Test</h2>
  <p>اختبار الحقول بخيارات متعددة لتحديد أي حقل يكتب بطلاقة على هاتفك بدون أي تعليق عند الحرف الأول:</p>

  <div class="input-group">
    <label>1. Text Input (interactive-widget=overlays-content)</label>
    <input type="text" dir="auto" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="اكتب هنا وشوف هل يعلق بالحرف الأول؟">
  </div>

  <div class="input-group">
    <label>2. Search Input (enterkeyhint=search)</label>
    <input type="search" dir="auto" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="ابحث هنا...">
  </div>

  <div class="input-group">
    <label>3. Email Input (one-time-code disable autofill)</label>
    <input type="email" dir="ltr" autocomplete="one-time-code" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="name@example.com">
  </div>

  <div class="input-group">
    <label>4. Password Input (new-password)</label>
    <input type="password" autocomplete="new-password" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="••••••••">
  </div>

  <div class="input-group">
    <label>5. Textarea (No autofill)</label>
    <textarea rows="3" dir="auto" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="اكتب نصاً طويل هنا..."></textarea>
  </div>
</body>
</html>
